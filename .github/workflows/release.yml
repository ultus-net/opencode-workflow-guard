name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write      # for npm provenance (sigstore)

jobs:
  release:
    name: Release / Version Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Fail fast before the registry does: OIDC trusted publishing requires
      # repository.url to match the sigstore provenance claim, and npm pack is
      # the last cheap point to catch a malformed or missing field.
      - name: Verify publish-critical package metadata
        run: |
          node -e \
            "const p=require('./package.json');
            if (p.repository?.url !== 'git+https://github.com/ultus-net/opencode-workflow-guard.git') {
              console.error('repository.url mismatch:', JSON.stringify(p.repository));
              process.exit(1);
            }
            if (!p.main || !p.files?.length) {
              console.error('main/files missing');
              process.exit(1);
            }"
      - run: npm pack --dry-run

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npx changeset publish
          commit: "chore: release version"
          title: "chore: release version"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Changesets v3 CLI creates git tags locally during publish but changesets/action@v1
      # does not push them when published packages format is not parsed. Ensure tags are pushed
      # and GitHub Releases are generated for any unreleased tags on publish.
      - name: Push git tags and create GitHub Releases
        run: |
          git push --tags || true
          for tag in $(git tag --points-at HEAD); do
            if ! gh release view "$tag" &>/dev/null; then
              echo "Creating GitHub Release for $tag"
              gh release create "$tag" --generate-notes --title "$tag" || true
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
