name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on PRs to keep the queue moving.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───── Static gates ─────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # ───── Unit tests ─────
  # The plugin is a TS file auto-loaded by opencode; the fast in-memory unit
  # suite runs on each supported Node. Node 20 is dropped: GitHub itself is
  # deprecating it (forcing actions to Node 24), and the guard targets modern
  # Node by convention (see tsconfig target/lib).
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # ───── Heavier checks ─────
  # Install the latest OpenCode CLI so package and provider-free loader checks run.
  # Model-driven probes are opt-in because external providers are not a CI invariant.
  e2e:
    name: E2E (plugin load / opencode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --global opencode-ai@latest
      - run: npm run test:install

  # ───── Supply-chain gate ─────
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run npm audit with 503 tolerance
        run: |
          npm audit --audit-level=high || {
            code=$?
            if npm audit --audit-level=high 2>&1 | grep -qi "503"; then
              echo "::warning::npm registry audit service unavailable (HTTP 503); skipping advisory check"
            else
              exit $code
            fi
          }

  # ───── PR etiquette ─────
  # Every PR must update CHANGELOG.md or add a .changeset/*.md fragment (Policy 3).
  # Automated Changeset version release PRs are exempted.
  changelog:
    name: Changelog / Changeset updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.head_ref != 'changeset-release/main' && !startsWith(github.head_ref, 'changeset-release/')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify CHANGELOG or Changeset modified
        run: |
          BASE="origin/${{ github.base_ref }}"
          DIFF_FILES=$(git diff --name-only "${BASE}...HEAD" || git diff --name-only HEAD~1...HEAD)
          if echo "$DIFF_FILES" | grep -qiE '^(CHANGELOG\.md|\.changeset\/[^\/]+\.md)$'; then
            echo "CHANGELOG.md or .changeset/*.md updated relative to base branch - good."
          else
            echo "::error::PR diff must include changes to CHANGELOG.md or a .changeset/*.md file (Policy 3)"
            exit 1
          fi

  # ───── Dogfood self-load test ─────
  dogfood:
    name: Dogfood (guard self-load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --global opencode-ai@latest
      - name: Smoke test guard loading
        run: |
          TMP=$(mktemp -d)
          mkdir -p "$TMP/.opencode/plugins"
          cp src/workflow-guard.ts "$TMP/.opencode/plugins/"
          PLUGIN_DIR=$(dirname "$(realpath "$TMP"/.*/*/*.ts)")
          cp -R src/lib src/policies "$PLUGIN_DIR/"
          cd "$TMP"
          echo '{"plugin":["file://./.opencode/plugins/workflow-guard.ts"]}' > opencode.json
          opencode debug startup >/dev/null

  # ───── Human-readable summary ─────
  status:
    name: Status
    runs-on: ubuntu-latest
    needs: [typecheck, test, e2e, audit, changelog, dogfood]
    if: always()
    steps:
      - name: Report gates
        run: |
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "e2e:       ${{ needs.e2e.result }}"
          echo "audit:     ${{ needs.audit.result }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "changelog: ${{ needs.changelog.result }}"
          fi

          for result in \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.audit.result }}" \
            "${{ needs.dogfood.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required CI job did not succeed: $result"
              exit 1
            fi
          done
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changelog.result }}" != "success" ] && [ "${{ needs.changelog.result }}" != "skipped" ]; then
            echo "::error::Changelog gate did not succeed"
            exit 1
          fi
